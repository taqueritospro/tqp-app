# Local cloud-like environment: the same topology as the cloud deployment.
# Simulated cloud mode uses this file alone; development mode adds compose.dev.yaml.
name: tqp-app

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    environment:
      API_PORT: ${PORT:?set PORT in .env}
    ports:
      - '127.0.0.1:80:80'
      - '127.0.0.1:443:443'
      - '127.0.0.1:443:443/udp'
      - '[::1]:80:80'
      - '[::1]:443:443'
      - '[::1]:443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on: [web, api]

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
    restart: unless-stopped
    init: true
    networks: [edge]

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
      target: prod
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:?set APP_ENV in .env}
      PORT: ${PORT}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:?set WEB_ORIGIN in .env}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT in .env}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM in .env}
      PLANTUML_URL: ${PLANTUML_URL:?set PLANTUML_URL in .env}
    networks: [edge, data, services, mail]

  postgres:
    image: postgres:18.6-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333 -master.telemetry=false
    environment:
      # SeaweedFS registers these as the S3 admin identity; anonymous requests are rejected.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
    volumes:
      - seaweedfs_data:/data
    networks: [services]

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      # Web UI to read captured mail; SMTP (1025) stays internal.
      - '127.0.0.1:8025:8025'
    networks: [mail]

  plantuml:
    image: plantuml/plantuml-server:jetty-v1.2026.8
    restart: unless-stopped
    mem_limit: 512m
    environment:
      # Keep the Java heap below the container limit so Docker does not kill it.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    networks: [services]

networks:
  edge: {}
  data:
    internal: true
  services:
    internal: true
  mail: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  postgres_data: {}
  seaweedfs_data: {}
